name: Build and Release

on:
  push:
    tags:
      - 'v*' # Run when a tag like v1.0.0 is pushed

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository (fetch tags)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Compile with PyInstaller
      shell: pwsh
      run: |
        # Use the exact command from kompilowanie.txt
        python -m PyInstaller main.py -w --onedir --icon=ikona_sc.ico --clean --exclude-module PyQt6.QtWebEngine --exclude-module PyQt6.QtQml --exclude-module PyQt6.QtNetwork --exclude-module PyQt6.QtPdf --exclude-module PyQt6.QtMultimedia --exclude-module PyQt6.QtMultimediaWidgets --exclude-module PyQt6.QtSql --exclude-module PyQt6.QtXml --exclude-module PyQt6.QtBluetooth --exclude-module PyQt6.QtPositioning --exclude-module PyQt6.QtSensors

    - name: Show build output
      shell: pwsh
      run: |
        if (Test-Path 'dist') { Get-ChildItem -Recurse -Force dist | Select-Object FullName, Length } else { Write-Host 'dist directory not found' }

    - name: Validate build produced main.exe
      shell: pwsh
      run: |
        if (-not (Test-Path 'dist\main\main.exe')) {
          Write-Error "Build failed: dist\\main\\main.exe not found"
          exit 1
        }

    - name: Copy shortcuts.json and icons into dist/main
      shell: pwsh
      run: |
        if (Test-Path 'shortcuts.json') { Copy-Item 'shortcuts.json' -Destination 'dist\main\' -Force }
        if (Test-Path 'ikona_sc.ico') { Copy-Item 'ikona_sc.ico' -Destination 'dist\main\' -Force }
        if (Test-Path 'ikona_bw.ico') { Copy-Item 'ikona_bw.ico' -Destination 'dist\main\' -Force }

    - name: Pack dist/main into ZIP
      shell: pwsh
      run: |
        if (Test-Path show-control-windows.zip) { Remove-Item show-control-windows.zip -Force }
        Compress-Archive -Path (Join-Path $PWD 'dist\main\*') -DestinationPath show-control-windows.zip

    - name: List ZIP contents
      run: |
        pwsh -c "Expand-Archive -Path show-control-windows.zip -DestinationPath .\_show_control_temp -Force; Get-ChildItem -Recurse .\_show_control_temp | Select-Object FullName, Length"

    - name: Create GitHub Release and upload ZIP
      uses: softprops/action-gh-release@v2
      with:
        files: |
          show-control-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
