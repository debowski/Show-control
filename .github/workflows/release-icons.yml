name: Release with Icons

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for icon files
        id: check_assets
        run: |
          echo "ikona_bw_exists=false" >> $GITHUB_OUTPUT
          echo "ikona_sc_exists=false" >> $GITHUB_OUTPUT
          if [ -f ikona_bw.ico ]; then echo "ikona_bw_exists=true" >> $GITHUB_OUTPUT; fi
          if [ -f ikona_sc.ico ]; then echo "ikona_sc_exists=true" >> $GITHUB_OUTPUT; fi

      - name: Upload ikona_bw.ico
        if: ${{ steps.check_assets.outputs.ikona_bw_exists == 'true' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./ikona_bw.ico
          asset_name: ikona_bw.ico
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ikona_sc.ico
        if: ${{ steps.check_assets.outputs.ikona_sc_exists == 'true' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./ikona_sc.ico
          asset_name: ikona_sc.ico
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
