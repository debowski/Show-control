name: Build and Release

on:
  push:
    tags:
      - 'v*' # Uruchomi się, gdy dodasz tag np. v1.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Sprawdzenie kodu (Checkout)
      uses: actions/checkout@v4

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalacja zależności
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Kompilacja PyInstallerem
      run: |
        pyinstaller --noconfirm --onedir --windowed main.py

    - name: Kopiowanie pliku shortcuts.json do folderu dist
      run: |
        xcopy shortcuts.json dist\main\ /Y

    - name: Pakowanie folderu wyjściowego do ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path dist/main -DestinationPath show-control-windows.zip

    - name: Tworzenie GitHub Release i Upload pliku ZIP
      uses: softprops/action-gh-release@v2
      with:
        files: show-control-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}